[project]
name = "telegram-market"
version = "0.1.0"
description = "Telegram bot that monitors marketplace listings (subscription service)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL/Redis (TEST_DATABASE_URL / TEST_REDIS_URL)",
]
